name: Comprobar webs

# Cada 5 minutos (GitHub puede retrasarlo unos minutos cuando va cargado). Corre fuera del OVH:
# avisa aunque se caiga la máquina entera.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # para guardar estado.json cuando cambia

concurrency:
  group: comprobar
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mirar las webs y avisar si alguna cae o vuelve
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 comprobar.py
      - name: Guardar el estado si ha cambiado
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "estado-webs"
            git config user.email "estado-webs@users.noreply.github.com"
            git add estado.json
            git commit -m "estado $(date -u '+%F %H:%M')"
            git push
          fi
